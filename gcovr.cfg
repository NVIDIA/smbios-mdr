# gcovr configuration for smbios-mdr

# Ignore gcov errors for files where no working dir resolves (e.g. subproject
# .gcno/.gcda with version mismatch B33 vs B50 when build uses different GCC).
gcov-ignore-errors = no_working_dir_found

filter = src/
filter = include/

# Exclude test directories (from final report)
exclude = .*/tests/.*
exclude = .*/test/.*

# Exclude subprojects directory
exclude = .*/subprojects/.*

# Exclude tools, fuzzer (if present)
exclude = .*/tools/.*
exclude = .*/fuzzer/.*

# Exclude test and mock files anywhere
exclude = .*/test_.*
exclude = .*/mock_.*

# Exclude system headers
exclude = /usr/.*

# Exclude main/app entry points not run by unit tests (improves reported coverage)
exclude = .*mdrv2_main\.cpp
exclude = .*cpuinfo_main\.cpp

# Exclude compiler-generated exception-handling branches (e.g. copy/move
# constructors of std containers) that are not reachable in normal code paths.
exclude-throw-branches = yes

# Exclude branches in lines that are not reachable (compiler dead code).
exclude-unreachable-branches = yes

decisions = yes

# Branch metric for text summary (use txt-metric, not deprecated txt-branch).
txt-metric=branch

# Default HTML output (used when gcovr is run without -o/--output).
output = coverage.html
html = yes
